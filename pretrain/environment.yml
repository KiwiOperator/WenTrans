name: wentrans
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - numpy<2          # torch 2.2 was built against NumPy 1.x
      - torch==2.2.2
      - transformers==4.41.2
      - datasets==2.19.2
      - accelerate==0.30.1
      - tokenizers
      - sentencepiece
